{% extends "layout.html" %}

{% block extra_css %}
<link
  rel="stylesheet"
  type="text/css"
  href="{{ url_for('static', filename='css/e_salvatore_regist.css') }}"
/>
{% endblock %}

{% block isi %}
<div class="activity">
  <div class="activity-left">
    <a href="{{ url_for('salvatore' ) }}"><button>Back to Salvatoré</button></a>
    {% block poster %} {% endblock %}
  </div>
  <div class="activity-right">
    <h1>{% block title %} {% endblock %}</h1>
    {% block desc %} {% endblock %}

    {% block form %} {% endblock %}
  </div>
</div>
{% endblock isi %}

{% block extra_js %}
  <script src="{{ url_for('static', filename='js/detail.js') }}"></script>
  <script src="{{ url_for('static', filename='js/shown_up.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('form');
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          
          const formData = new FormData(form);
          const competition = window.location.pathname.split('/').pop(); // Get competition from URL
          
          fetch(`/register/${competition}`, {
            method: 'POST',
            body: formData
          })
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              alert('Registration successful!');
              form.reset();
            } else {
              alert('Registration failed: ' + data.message);
            }
          })
          .catch(error => {
            console.error('Error:', error);
            alert('An error occurred. Please try again.');
          });
        });
      }
    });
  </script>
{% endblock %}
