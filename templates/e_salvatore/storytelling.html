{% extends 'e_salvatore/regist_layout.html' %}

{% block poster %}
  <img
    src="{{ url_for('static', filename='img/salvatore/story-telling-rohani.jpeg') }}"
    alt="Story Telling Rohani"
  >
{% endblock %}

{% block title %} Story Telling Rohani {% endblock %}

{% block form %}
  <form class="form" id="form">
    <h1>Registration Form</h1>
    <label for="nama">Nama Lengkap : </label><br>
    <input type="text" name="nama" required><br><br>

    <label for="kategori">Kategori : </label><br>
    <select name="kategori" required>
      <option value="">Pilih Kategori</option>
      <option value="SMP">SMP</option>
      <option value="SMA">SMA</option>
    </select><br><br>

    <label for="kelas">Kelas : </label><br>
    <input type="text" name="kelas" required><br><br>

    <label for="agama">Agama : </label><br>
    <select name="agama" required>
      <option value="">Pilih Agama</option>
      <option value="Kristen">Kristen</option>
      <option value="Katolik">Katolik</option>
    </select><br><br>

    <label for="tema">Tema Bacaan : </label><br>
    <select name="tema" required>
      <option value="">Pilih Tema</option>
      <option value="Cahaya di Tengah Kegelapan">Cahaya di Tengah Kegelapan</option>
      <option value="Kasih yang Mematahkan Belenggu">Kasih yang Mematahkan Belenggu</option>
      <option value="Kisah Domba yang Hilang dan Ditemukan">Kisah Domba yang Hilang dan Ditemukan</option>
      <option value="Misteri Kubur Kosong">Misteri Kubur Kosong</option>
    </select><br>
    
    <button>Register</button>
  </form>
{% endblock %}
