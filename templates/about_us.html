  // =========================================================
  // HORIZONTAL MENU SLIDER
  // =========================================================
  const menuSliderTrack = document.getElementById("menuSliderTrack");
  const menuSliderLeft = document.getElementById("menuSliderLeft");
  const menuSliderRight = document.getElementById("menuSliderRight");

  // Generate menu items
  ardraxisCabinet.forEach((sekbid, index) => {
    const menuItem = document.createElement("a");
    menuItem.href = `#${sekbid.sekbid_id}`;
    menuItem.className = "menu-slider-item";
    menuItem.textContent = sekbid.sekbid;
    menuItem.dataset.sekbidId = sekbid.sekbid_id;
    menuItem.addEventListener("click", (e) => {
      e.preventDefault();
      const targetSection = document.getElementById(sekbid.sekbid_id);
      if (targetSection) {
        const menuSlider = document.getElementById("sekbidMenuSlider");
        const menuHeight = menuSlider ? menuSlider.offsetHeight : 0;
        const navbarHeight = 60; // Approximate navbar height
        const offsetTop = targetSection.offsetTop - navbarHeight - menuHeight - 20;
        window.scrollTo({
          top: Math.max(0, offsetTop),
          behavior: "smooth"
        });
      }
    });
    menuSliderTrack.appendChild(menuItem);
  });

  // Scroll buttons functionality
  function updateScrollButtons() {
    const track = menuSliderTrack;
    const maxScroll = track.scrollWidth - track.clientWidth;
    
    if (track.scrollLeft <= 0) {
      menuSliderLeft.classList.add("hidden");
    } else {
      menuSliderLeft.classList.remove("hidden");
    }
    
    if (track.scrollLeft >= maxScroll - 5) {
      menuSliderRight.classList.add("hidden");
    } else {
      menuSliderRight.classList.remove("hidden");
    }
  }

  menuSliderLeft.addEventListener("click", () => {
    menuSliderTrack.scrollBy({ left: -200, behavior: "smooth" });
  });

  menuSliderRight.addEventListener("click", () => {
    menuSliderTrack.scrollBy({ left: 200, behavior: "smooth" });
  });

  menuSliderTrack.addEventListener("scroll", updateScrollButtons);
  window.addEventListener("resize", updateScrollButtons);
  updateScrollButtons();

  // Active state tracking on scroll
  const menuItems = document.querySelectorAll(".menu-slider-item");
  const sections = document.querySelectorAll(".sekbid-section");

  function updateActiveMenu() {
    let current = "";
    const scrollPosition = window.scrollY + 150; // Offset for sticky menu
    
    const menuSlider = document.getElementById("sekbidMenuSlider");
    const menuHeight = menuSlider ? menuSlider.offsetHeight : 0;
    const navbarHeight = 60;
    const scrollOffset = scrollPosition + navbarHeight + menuHeight + 50;
    
    sections.forEach((section) => {
      const sectionTop = section.offsetTop;
      const sectionHeight = section.clientHeight;
      
      if (scrollOffset >= sectionTop && scrollOffset < sectionTop + sectionHeight) {
        current = section.id || "";
      }
    });
    
    menuItems.forEach((item) => {
      item.classList.remove("active");
      if (item.dataset.sekbidId === current) {
        item.classList.add("active");
        // Auto-scroll menu item into view if needed
        const itemRect = item.getBoundingClientRect();
        const trackRect = menuSliderTrack.getBoundingClientRect();
        
        if (itemRect.left < trackRect.left) {
          item.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "start" });
        } else if (itemRect.right > trackRect.right) {
          item.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "end" });
        }
      }
    });
  }

  window.addEventListener("scroll", updateActiveMenu);
  // Panggil saat konten selesai dimuat sepenuhnya
  window.addEventListener("load", updateActiveMenu);

  // =========================================================
  // GENERATE HTML SEKBID DAN CARD ANGGOTA SECARA DINAMIS
  // =========================================================
  for (let sekbid in ardraxisCabinet) {
    const sekbidContent = document.createElement("section");
    sekbidContent.className = `sekbid-section reveal-on-scroll`;
    sekbidContent.id = ardraxisCabinet[sekbid].sekbid_id;
    container.append(sekbidContent);

    // Di sini letak optimasi gambarnya (tambah loading="lazy" dan decoding="async")
    sekbidContent.innerHTML += `
      <div class="sekbid-cloud sekbid-cloud-left-top"></div>
      <div class="sekbid-cloud sekbid-cloud-left-mid"></div>
      <div class="sekbid-cloud sekbid-cloud-left-bottom"></div>

      <div class="sekbid-cloud sekbid-cloud-center-top"></div>
      <div class="sekbid-cloud sekbid-cloud-center-mid"></div>
      <div class="sekbid-cloud sekbid-cloud-center-bottom"></div>

      <div class="sekbid-cloud sekbid-cloud-right-top"></div>
      <div class="sekbid-cloud sekbid-cloud-right-mid"></div>
      <div class="sekbid-cloud sekbid-cloud-right-bottom"></div>

      <h1 class="sekbid-title">${ardraxisCabinet[sekbid].sekbid}</h1>

      <div class="sekbid-image-card">
          <div class="image-carousel-container">
              <img
                  src="${staticBase}img/fotokabinet/${ardraxisCabinet[sekbid].sekbid_image[0]}"
                  alt="${ardraxisCabinet[sekbid].sekbid} 1"
                  class="image-carousel-image"
                  loading="lazy"
                  decoding="async"
              />
              <img
                  src="${staticBase}img/fotokabinet/${ardraxisCabinet[sekbid].sekbid_image[1]}"
                  alt="${ardraxisCabinet[sekbid].sekbid} 2"
                  class="image-carousel-image"
                  loading="lazy"
                  decoding="async"
              />
              <img
                  src="${staticBase}img/fotokabinet/${ardraxisCabinet[sekbid].sekbid_image[2]}"
                  alt="${ardraxisCabinet[sekbid].sekbid} 3"
                  class="image-carousel-image"
                  loading="lazy"
                  decoding="async"
              />
          </div>
      </div>

      <div class="sekbid-cloud sekbid-cloud-between-left"></div>
      <div class="sekbid-cloud sekbid-cloud-between-center"></div>
      <div class="sekbid-cloud sekbid-cloud-between-right"></div>

      <div class="sekbid-card-wrapper ${ardraxisCabinet[sekbid].sekbid_id}">
      </div>
    `;
            
    const cardWrapper = document.querySelector(`.${ardraxisCabinet[sekbid].sekbid_id}`);
    
    for (let memberData in ardraxisCabinet[sekbid].members) {
      const member = ardraxisCabinet[sekbid].members[memberData];
      let experience = member.exp;
      if (experience == 1) {
        experience += " YEAR";
      } else {
        experience += " YEARS";
      }

      // Di sini juga dilakukan optimasi untuk foto-foto member
      cardWrapper.innerHTML += `
        <article class="sekbid-card">
            <div class="sekbid-card-inner">
                <header class="sekbid-card-header">
                    <span class="sekbid-card-experience">${experience} OF EXPERIENCE</span>
                    <span class="sekbid-card-jersey">${member.jersey}</span>
                </header>

                <div class="sekbid-card-body">
                    <div class="sekbid-card-photo-wrapper">
                        <div class="carousel-container">
                            <img
                                src="${staticBase}img/fotokabinet/${member.images[0]}"
                                alt="${member.name} 1"
                                class="sekbid-card-photo carousel-image"
                                loading="lazy"
                                decoding="async"
                            />
                            <img
                                src="${staticBase}img/fotokabinet/${member.images[1]}"
                                alt="${member.name} 2"
                                class="sekbid-card-photo carousel-image"
                                loading="lazy"
                                decoding="async"
                            />
                            <img
                                src="${staticBase}img/fotokabinet/${member.images[2]}"
                                alt="${member.name} 3"
                                class="sekbid-card-photo carousel-image"
                                loading="lazy"
                                decoding="async"
                            />
                        </div>
                    </div>
                    <p class="sekbid-card-name">${member.name}</p>
                    <p class="sekbid-card-nickname">(${member.nicknames})</p>
                </div>

                <footer class="sekbid-card-footer">
                    <p class="sekbid-card-role-${member.style}">${member.jabatan}</p>
                    <a href="https://www.instagram.com/${member.instagram}/" target="_blank" class="sekbid-card-instagram">
                        <i class="bi bi-instagram"></i>
                    </a>
                </footer>
            </div>
        </article>
      `;
    }
  }
</script>
{% endblock %}
