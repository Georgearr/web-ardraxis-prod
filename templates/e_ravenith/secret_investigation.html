{% extends "e_ravenith/regist_layout.html" %}
{% block form_notes %}
<p class="form-notes">Kelas harus sama untuk seluruh anggota; tidak boleh gabung kelas lain.</p>
{% endblock %}
{% block form_fields %}
<label for="nama_tim">Nama Tim</label>
<input type="text" id="nama_tim" name="nama_tim" required />

<label for="ketua">Ketua</label>
<input type="text" id="ketua" name="ketua" required />

<label for="anggota_1">Anggota 1</label>
<input type="text" id="anggota_1" name="anggota_1" required />

<label for="kelas">Kelas</label>
<input type="text" id="kelas" name="kelas" required />

<label for="id_line_ketua">ID LINE Ketua</label>
<input type="text" id="id_line_ketua" name="id_line_ketua" required />

<label for="id_line_anggota_1">ID LINE Anggota 1</label>
<input type="text" id="id_line_anggota_1" name="id_line_anggota_1" required />
{% endblock %}
