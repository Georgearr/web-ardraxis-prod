<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ravenith Photobooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/photobooth.css') }}" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg photobooth-nav sticky-top">
    <div class="container">
      <a class="navbar-brand photobooth-brand fw-bold" href="{{ url_for('ravenith') }}">
        <img
          src="{{ url_for('static', filename='img/logo_ardraxis.png') }}"
          alt="Ardraxis"
          class="photobooth-brand-logo"
          width="36"
          height="36"
        />
        <span>Ravenith</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('ravenith') }}">Event</a></li>
          <li class="nav-item"><a class="nav-link active" href="{{ url_for('photobooth_page') }}">Photobooth</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero-section">
    <div class="hero-banner-wrap">
      <img
        src="{{ url_for('static', filename='img/banner/' + banner_file) }}"
        alt="Ravenith Banner"
        class="hero-banner"
      />
      <div class="hero-overlay"></div>
    </div>
    <div class="container hero-content">
      <h1 class="hero-title">Ravenith Photobooth</h1>
      <p class="hero-subtitle">Capture Your Moments</p>
    </div>
  </header>

  <!-- Search & gallery -->
  <main class="gallery-section">
    <div class="container">
      <div class="row align-items-center mb-4 g-3">
        <div class="col-md-8">
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input
              type="search"
              id="searchInput"
              class="form-control"
              placeholder="Cari foto berdasarkan nama..."
              autocomplete="off"
            />
          </div>
        </div>
        <div class="col-md-4 text-md-end">
          <button type="button" class="btn btn-refresh" id="btnRefresh" title="Muat ulang dari Drive">
            <i class="bi bi-arrow-clockwise"></i> Refresh
          </button>
        </div>
      </div>

      <p class="gallery-meta text-center mb-4" id="galleryMeta" aria-live="polite"></p>

      <!-- Loading -->
      <div id="stateLoading" class="state-panel state-loading">
        <div class="spinner-border text-light" role="status" aria-hidden="true"></div>
        <p class="mt-3 mb-0">Memuat foto dari galeri...</p>
      </div>

      <!-- Error -->
      <div id="stateError" class="state-panel state-error d-none">
        <i class="bi bi-exclamation-triangle-fill state-icon"></i>
        <h2>Gagal memuat galeri</h2>
        <p id="errorMessage">Terjadi kesalahan saat menghubungi server.</p>
        <button type="button" class="btn btn-light mt-2" id="btnRetry">Coba lagi</button>
      </div>

      <!-- Empty -->
      <div id="stateEmpty" class="state-panel state-empty d-none">
        <i class="bi bi-images state-icon"></i>
        <h2>Belum ada foto</h2>
        <p>Foto photobooth akan muncul di sini setelah diunggah ke Google Drive.</p>
      </div>

      <!-- Grid -->
      <div id="galleryGrid" class="row g-4 d-none"></div>

      <!-- Load more -->
      <div class="text-center mt-4 mb-5 d-none" id="loadMoreWrap">
        <button type="button" class="btn btn-load-more" id="btnLoadMore">
          Muat lebih banyak
        </button>
      </div>
    </div>
  </main>

  <footer class="photobooth-footer text-center py-4">
    <div class="container">
      <p class="mb-0">&copy; Ravenith Photobooth</p>
    </div>
  </footer>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox d-none" role="dialog" aria-modal="true" aria-label="Preview foto">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Tutup">
      <i class="bi bi-x-lg"></i>
    </button>
    <button type="button" class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Sebelumnya">
      <i class="bi bi-chevron-left"></i>
    </button>
    <button type="button" class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Berikutnya">
      <i class="bi bi-chevron-right"></i>
    </button>
    <div class="lightbox-inner">
      <img id="lightboxImg" src="" alt="" />
      <p class="lightbox-caption" id="lightboxCaption"></p>
      <a id="lightboxDownload" class="btn btn-download" href="#" download target="_blank" rel="noopener">
        <i class="bi bi-download"></i> Download
      </a>
    </div>
  </div>

  <script>
    window.PHOTOBOOTH_CONFIG = {
      apiPhotosUrl: {{ api_photos_url | tojson }},
      pageSize: {{ page_size }},
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK7eN7NtcQZRjq" crossorigin="anonymous"></script>
  <script src="{{ url_for('static', filename='js/photobooth.js') }}"></script>
</body>
</html>
